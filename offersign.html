<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your offer — Pure Dental</title>
<style>
  :root { --accent: #3f82b4; --accent-strong: #316a97; --ink: #1c2630; --ink-2: #4a5663; --ink-3: #7a8694; --line: #dfe4e9; --surface: #fff; --surface-2: #f6f8fa; --ok: #1f8a4c; --warn: #b5651d; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--surface-2); color: var(--ink); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 32px 18px 60px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--ink-3); font-size: 13px; margin-bottom: 20px; }
  .row { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: 14px; margin-bottom: 4px; }
  .row b { font-weight: 600; }
  .label { color: var(--ink-3); }
  p.desc { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); white-space: pre-wrap; }
  .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 8px; padding: 11px 18px; font-weight: 600; font-size: 14px; border: 1px solid transparent; }
  .btn-accept { background: var(--accent); color: #fff; }
  .btn-decline { background: var(--surface); color: var(--warn); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-top: 10px; }
  .panel { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
  .panel.decline { border-color: var(--warn); }
  .status { font-size: 14px; line-height: 1.6; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--warn); }
  .foot { text-align: center; font-size: 12px; color: var(--ink-3); margin-top: 18px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div id="loading">Loading your offer…</div>
    </div>
    <div class="foot">Pure Dental &middot; Questions? Reply to the email this link came in.</div>
  </div>
  <script src="offersign.js"></script>
</body>
</html>
