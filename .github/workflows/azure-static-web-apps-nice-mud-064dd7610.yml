name: Azure Static Web Apps CI/CD
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Share the rule files with the API
        run: cp access-rules.js approvals-text.js weekmerge.js api/_shared/
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install API dependencies
        run: cd api && npm ci
      - name: Check the API libraries load
        run: cd api && node -e "require('@azure/storage-blob'); require('google-auth-library'); require('googleapis')"
      # Stamps the commit being deployed into version.json, read by the login screen and
      # /api/version. Derived from the commit itself, so it can never drift or be forgotten.
      - name: Run the tests
        run: cd api && node --test tests/
      - name: Compile the screens
        run: |
          mkdir -p "$RUNNER_TEMP/compile" && cd "$RUNNER_TEMP/compile" && npm init -y > /dev/null && npm install --no-audit --no-fund --silent @babel/core@7 @babel/preset-react@7
          node -e "const fs=require('fs'),path=require('path'),babel=require('@babel/core');const dir=process.env.GITHUB_WORKSPACE;let bad=0;const files=fs.readdirSync(dir).filter(f=>f.endsWith('.jsx'));for(const f of files){try{babel.transformSync(fs.readFileSync(path.join(dir,f),'utf8'),{presets:['@babel/preset-react'],filename:f,babelrc:false,configFile:false});}catch(e){bad++;console.log('Does not compile: '+f+' - '+String(e.message).split(String.fromCharCode(10))[0]);}}console.log('Screen files compiled: '+(files.length-bad)+' of '+files.length);process.exit(bad?1:0);"
      - name: Stamp deployed version
        env:
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
        run: |
          printf '{"short":"%s","sha":"%s","build":%s,"builtAt":"%s"}\n' \
            "${SHA:0:7}" "$SHA" "$RUN" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          cp version.json api/version/version.json
          cat version.json
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_MUD_064DD7610 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          production_branch: "main"
          app_location: "/"
          api_location: "api"
          output_location: ""
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_MUD_064DD7610 }}
          action: "close"
